lang: es

project:
  type: website
  pre-render:
    - "powershell -NoProfile -ExecutionPolicy Bypass -File scripts\\pre-render-clean.ps1"
  post-render: 
    - "powershell -NoProfile -Command \"if (Test-Path 'static') { Copy-Item -Path 'static\\\\*' -Destination '_site' -Recurse -Force }\""

website:
  title: "Paul Efren"
  site-url: https://paulefrensa.rbind.io/
  description: "Ecologia vegetal, taxonomia aplicada y herramientas reproducibles en R para biodiversidad en Peru"
  favicon: assets/paul/logo_pesa.svg
  page-navigation: true
  back-to-top-navigation: true
  twitter-card: true
  comments: 
    utterances: 
      repo: PaulESantos/paulefren 
      label: utterances
      theme: body-light
      issue-term: title
 
  navbar:
    logo: assets/paul/logo_pesa.svg
    tools:
    - icon: github
      href: https://www.github.com/PaulESantos/paulefren
    right:
      - text: Inicio
        aria-label: "Inicio"
        href: index.qmd
      - text: Sobre mi
        aria-label: "Sobre mi"
        href: about/index.qmd
      - text: Blog
        aria-label: "Blog"
        href: blog/index.qmd
      - text: Charlas
        aria-label: "Charlas"
        href: talk/index.qmd  
      - text: Publicaciones
        aria-label: "Publicaciones"
        href: publication/index.qmd
      - text: Proyectos
        aria-label: "Portafolio de proyectos"
        href: project/index.qmd
      - text: Contacto
        aria-label: "Contacto"
        href: contact.qmd
  
  page-footer:  
    left: >-
     &#169; 2026 Paul Efren Santos Andrade &#8729; Sitio hecho con [Quarto](https://quarto.org)
    center: |
      <a class="link-dark me-1" href="https://github.com/PaulEsantos" title="github" target="_blank" rel="noopener">{{< fa brands github >}}</a>
      <a class="link-dark me-1" href="https://orcid.org/0000-0002-6635-0375" title="orcid" target="_blank" rel="noopener">{{< ai orcid >}}</a>
      <a class="link-dark me-1" href="https://linkedin.com/in/paulesantosandrade" title="LinkedIn" target="_blank" rel="noopener">{{< fa brands linkedin >}}</a>

    right: 
      - text: "Contacto"
        aria-label: "Formulario de contacto"
        href: "contact.qmd"
      - text: "Licencia"
        aria-label: "Detalles de licencia"
        href: license.qmd

format: 
  html:
    theme:
      light:
        - cosmo
        - assets/paul-theme-light.scss
      dark: 
        - cosmo
        - assets/paul-theme-dark.scss
    highlight-style:
      light: a11y-light
      dark: a11y-dark
    code-link: true
    pagetitle: "{{< meta title >}} | Paul Efren Santos Andrade"

execute: 
  freeze: auto

include-in-header: assets/umami.html
